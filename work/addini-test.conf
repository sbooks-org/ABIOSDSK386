[dosbox]
memsize=4
[cpu]
core=normal
cputype=pentium
cycles=max
[autoexec]
mount c work/release-test
c:
mkdir direct
copy addini.com direct\addini.com
cd direct
echo [boot]>t1.ini
echo [386enh]>>t1.ini
echo key=value>>t1.ini
addini t1.ini 386Enh device=ABIOSDSK.386
echo [386Enh]>t2.ini
echo [386Enh]>>t2.ini
addini t2.ini 386Enh first=value
echo [other]>t3.ini
echo untouched=yes>>t3.ini
copy t3.ini t3.orig
addini t3.ini 386Enh absent=value
if errorlevel 6 echo MISSING_OK>missing.ok
addini >usage.txt
if errorlevel 2 echo USAGE_OK>usage.ok
exit
