[sdl]
fullscreen=false
[dosbox]
memsize=32
[cpu]
core=normal
cputype=pentium
cycles=max
[autoexec]
mount c .
mount d work/ddk-ref/WIN31/DDK/386
mount e work/msvc15/VISUALC/US/VC152C/MSVC15
c:
d:\TOOLS\MASM5.EXE -p -w2 -Mx -dABIOSDSK_DEBUG addini\addini.asm,build\addini.obj,build\addini.lst; >build\addini.log
if errorlevel 1 exit
e:\BIN\LINK.EXE /TINY build\addini.obj,build\addini.com,build\addini.map; >>build\addini.log
if errorlevel 1 exit
echo success>build\util.ok
exit
